# Router configuration. Model IDs live here and nowhere in code (ADR-0003).
#
# EVERY value below is UNVERIFIED: nothing in this repository has made a real provider call.
# - Limits (rpm, tpd) are copied from docs/RESEARCH.md. Groq's table does not say whether the
#   free or the developer column applies to a free account. Gemini and OpenRouter limits were not
#   found; they are left out, so those providers get no token bucket until someone measures them.
# - bucket.fraction = 0.5 means the router plans to use about half of a documented limit.
# - Model IDs: the Groq ID is the string quoted in RESEARCH.md and has not been checked against
#   Groq's live model list. The other two start with REPLACE and make the adapter refuse to call
#   until a real, current ID is entered (RESEARCH.md notes Gemini model names churn).
# - Keys come from the environment: GROQ_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY.

providers:
  groq:
    kind: groq
    hosted: true
    env_key: GROQ_API_KEY
    timeout_s: 30    # per provider; each provider's own value is passed to its calls
    rpm: 30          # UNVERIFIED (RESEARCH.md: 30 RPM)
    tpd: 200000      # UNVERIFIED for any model other than the ones under daily_tokens (RESEARCH.md)
    # MEASURED, n=1 (2026-11-21, assumptions row 53): a 429 for openai/gpt-oss-20b on the free plan
    # whose body names tokens per day: "Limit 200000, Used 200000, Requested 621 ... try again in
    # 4m28s" (Retry-After 269). A rolling cap, separate from the 8000 tokens/minute header. Used
    # by the daily tally in front of every live command (va_next26). Other models: UNVERIFIED.
    daily_tokens:
      openai/gpt-oss-20b: 200000
    # Seen once, 2026-11-20, in the response headers of 24 requests to openai/gpt-oss-20b:
    # x-ratelimit-limit-tokens: 8000. That it is per MINUTE is inferred from the header name and
    # from reset-tokens values of 1 to 56 seconds, not from documentation. It applies to this
    # key and model, may differ for others, and may differ from what a plan change gives.
    tpm: 8000
    # UNVERIFIED: that `low` reduces reasoning tokens (and so the empty `length` replies) for
    # openai/gpt-oss models. Sent only to Groq models whose id contains "gpt-oss"; override per
    # run with --reasoning-effort (assumptions rows 36 and 48). `grounded route probe --compare-reasoning
    # low,medium` measures it on the injection questions.
    reasoning_effort: low
    # The model reports reasoning tokens in its usage block (probe reports, 2026-11-20 and
    # 2026-11-21): compose and repair get a completion allowance of at least `reasoning_min_tokens`.
    reasoning_min_tokens: 2048
    models:
      default: openai/gpt-oss-20b   # UNVERIFIED ID
  gemini:
    kind: gemini
    hosted: true
    env_key: GEMINI_API_KEY
    # UNVERIFIED: 90 s is a guess sized from one probe (2026-11-20, gemini-3.5-flash): 5 calls
    # finished in 18.4-28.4 s and 13 hit a 30 s limit. Where the real latency tail ends is not
    # known; 90 may still be too short or may only make failures slower. Groq stays at 30.
    timeout_s: 90
    reasoning_min_tokens: 2048   # reports reasoning (thoughts) tokens: gemini-3.5-flash report 2026-11-20
    models:
      default: REPLACE-WITH-CURRENT-GEMINI-FLASH-MODEL-ID
  openrouter:
    kind: openrouter
    hosted: true
    env_key: OPENROUTER_API_KEY
    timeout_s: 30
    reasoning_min_tokens: 2048   # reports reasoning tokens: nvidia nemotron reasoning report 2026-11-20
    models:
      default: REPLACE-WITH-A-CURRENT-FREE-MODEL-ID

  # A model on this computer through Ollama. Not hosted: it may see internal data. Which model
  # gives usable answers on a 4 GB GPU is UNMEASURED; name one you have pulled (`ollama list`).
  ollama:
    kind: ollama
    hosted: false
    endpoint: http://localhost:11434/v1/chat/completions
    timeout_s: 180
    models:
      default: REPLACE-WITH-A-MODEL-YOU-HAVE-PULLED

# Provider order per task (PHASE_1C.md section b). The local 3-4B tier for `route` is not built.
tasks:
  route: [groq, gemini, openrouter]
  plan: [groq, gemini, openrouter]
  compose: [groq, gemini, openrouter]
  repair: [groq, gemini, openrouter]

# Data sensitivity: hosted providers only ever see datasets tagged public. A dataset that is not
# listed here is treated as internal (fail closed).
datasets:
  analytics.sales_lines: public   # UCI Online Retail, CC BY 4.0
  docs.public: public             # passages from documents ingested with sensitivity=public
  # docs.internal is deliberately not listed: untagged means internal, so hosted providers refuse

retry:
  max_retries: 3          # per provider per call
  base_s: 1.0
  cap_s: 20.0
  jitter: 0.5

# HTTP 429: wait the provider's Retry-After (with none: until the token guard says the request
# fits), retry ONCE; a wait above max_wait_s is not shortened, the provider is given up for the
# call. Every wait is recorded and reported.
rate_limit:
  max_wait_s: 60
  retries: 1

breaker:
  consecutive_429: 3
  cooldown_s: 60

# Token guard: before a request, prompt characters / 4 plus max_tokens is taken from the
# per-minute bucket; if it does not fit, the router waits (at most max_wait_s, each wait reported).
# fraction 0.9 (UNVERIFIED): at 0.5 a compose request of about 2,600 prompt tokens plus a 2,048
# allowance (4,650) could never fit Groq's 8,000 tokens/minute.
bucket:
  fraction: 0.9
  max_wait_s: 60          # a longer wait for the bucket falls through to the next provider

budget:
  per_run_tokens: 30000   # UNVERIFIED assumption (PHASE_1C.md section b)

# `grounded live probe`: hard limits for one probe run. max_requests counts every HTTP request sent,
# retries included. The default is 25; `grounded live probe --max-requests N` can raise it to 60, the
# hard ceiling. token_cap is across the whole run. UNVERIFIED sizing.
probe:
  max_requests: 25
  token_cap: 60000
