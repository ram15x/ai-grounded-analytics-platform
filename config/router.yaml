# Router configuration. Model IDs live here and nowhere in code (ADR-0003).
#
# EVERY value below is UNVERIFIED: nothing in this repository has made a real provider call.
# - Limits (rpm, tpd) are copied from docs/RESEARCH.md. Groq's table does not say whether the
#   free or the developer column applies to a free account. Gemini and OpenRouter limits were not
#   found; they are left out, so those providers get no token bucket until someone measures them.
# - bucket.fraction = 0.5 means the router plans to use about half of a documented limit.
# - Model IDs: the Groq ID is the string quoted in RESEARCH.md and has not been checked against
#   Groq's live model list. The other two start with REPLACE and make the adapter refuse to call
#   until a real, current ID is entered (RESEARCH.md notes Gemini model names churn).
# - Keys come from the environment: GROQ_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY.

providers:
  groq:
    kind: groq
    hosted: true
    env_key: GROQ_API_KEY
    timeout_s: 30    # per provider; each provider's own value is passed to its calls
    rpm: 30          # UNVERIFIED (RESEARCH.md: 30 RPM)
    tpd: 200000      # UNVERIFIED (RESEARCH.md: 200K TPD)
    # Seen once, 2026-11-20, in the response headers of 24 requests to openai/gpt-oss-20b:
    # x-ratelimit-limit-tokens: 8000. That it is per MINUTE is inferred from the header name and
    # from reset-tokens values of 1 to 56 seconds, not from documentation. It applies to this
    # key and model, may differ for others, and may differ from what a plan change gives.
    tpm: 8000
    # reasoning_effort: low   # UNVERIFIED and NOT SET: no real call has sent it. Whether Groq
    #                         # accepts it for this model, and with which values, is unknown.
    #                         # It is sent only if you uncomment it, and then only to Groq.
    models:
      default: openai/gpt-oss-20b   # UNVERIFIED ID
  gemini:
    kind: gemini
    hosted: true
    env_key: GEMINI_API_KEY
    # UNVERIFIED: 90 s is a guess sized from one probe (2026-11-20, gemini-3.5-flash): 5 calls
    # finished in 18.4-28.4 s and 13 hit a 30 s limit. Where the real latency tail ends is not
    # known; 90 may still be too short or may only make failures slower. Groq stays at 30.
    timeout_s: 90
    models:
      default: REPLACE-WITH-CURRENT-GEMINI-FLASH-MODEL-ID
  openrouter:
    kind: openrouter
    hosted: true
    env_key: OPENROUTER_API_KEY
    timeout_s: 30
    models:
      default: REPLACE-WITH-A-CURRENT-FREE-MODEL-ID

# Provider order per task (PHASE_1C.md section b). The local 3-4B tier for `route` is not built.
tasks:
  route: [groq, gemini, openrouter]
  plan: [groq, gemini, openrouter]
  compose: [groq, gemini, openrouter]
  repair: [groq, gemini, openrouter]

# Data sensitivity: hosted providers only ever see datasets tagged public. A dataset that is not
# listed here is treated as internal (fail closed).
datasets:
  analytics.sales_lines: public   # UCI Online Retail, CC BY 4.0
  docs.public: public             # passages from documents ingested with sensitivity=public
  # docs.internal is deliberately not listed: untagged means internal, so hosted providers refuse

retry:
  max_retries: 3          # per provider per call
  base_s: 1.0
  cap_s: 20.0
  jitter: 0.5
  max_retry_after_s: 30   # a longer retry-after falls through to the next provider instead

breaker:
  consecutive_429: 3
  cooldown_s: 60

bucket:
  fraction: 0.5
  max_wait_s: 10          # a longer wait for the bucket falls through to the next provider
                          # (a probe has no fallback and waits up to 120 s instead)

budget:
  per_run_tokens: 30000   # UNVERIFIED assumption (PHASE_1C.md section b)

# `va live probe`: hard limits for one probe run. max_requests counts every HTTP request sent,
# retries included. The default is 25; `va live probe --max-requests N` can raise it to 60, the
# hard ceiling. token_cap is across the whole run. UNVERIFIED sizing.
probe:
  max_requests: 25
  token_cap: 60000
