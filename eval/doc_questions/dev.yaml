# Retrieval dev questions over corpus/synthetic. AUTHOR-WRITTEN by the project author, who also
# wrote the corpus: not an independent benchmark. Each evidence item names a document and a string
# that must occur in it; a chunk is relevant when it comes from that document and contains the string
# (case and whitespace ignored). No answer text beyond that anchor is stored.
