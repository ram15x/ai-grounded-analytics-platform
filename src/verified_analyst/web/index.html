<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verified Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: dark hero with the ask box, then a pipeline strip, answer + linked evidence, and a ledger. */
:root{
  --paper:#F3EFE6; --card:#FCFAF5; --ink:#171612; --mute:#6A665B; --line:#DCD5C5;
  --night:#12110E; --night2:#1C1B17; --night-line:#34322B; --night-ink:#ECE7DA; --night-mute:#98937F;
  --ok:#1F7A4D; --ok-bg:#D9ECDD; --ok-glow:#4FD18B; --warn:#A35F00; --warn-bg:#F7E5BF; --amber:#E9B44C; --bad:#A33232;
  --violet:#5C3FA0; --violet-bg:#E7E0F4; --focus:#2F6BFF;
  --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hero{background:radial-gradient(900px 300px at 85% -20%,#2c4a3a55,transparent),var(--night);color:var(--night-ink);padding:0 28px 34px}
.top{display:flex;align-items:center;gap:24px;padding:16px 0;border-bottom:1px solid var(--night-line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:600 18px var(--display)}
.mark{width:26px;height:26px;border-radius:7px;background:var(--ok-glow);display:grid;place-items:center;color:var(--night)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{background:none;border:0;color:var(--night-mute);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500}
.tabs button[aria-selected=true]{background:var(--night2);color:var(--night-ink)}
.mode{margin-left:auto;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid #5a4a22;border-radius:99px;padding:4px 10px}
.mode::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-right:7px}
.h1{font:700 clamp(30px,5vw,52px)/1.04 var(--display);letter-spacing:-.02em;margin:34px 0 10px;max-width:18ch;text-wrap:balance}
.h1 em{font-style:normal;color:var(--ok-glow)}
.sub{color:var(--night-mute);max-width:62ch;margin:0 0 22px}
.ask{display:flex;gap:8px;max-width:760px;background:var(--night2);border:1px solid var(--night-line);border-radius:12px;padding:6px}
.ask input{flex:1;min-width:0;background:none;border:0;color:var(--night-ink);font:17px var(--body);padding:10px 12px}
.ask input:focus-visible{outline:none}
.ask:focus-within{border-color:var(--ok-glow)}
.go{background:var(--ok-glow);color:var(--night);border:0;border-radius:8px;padding:0 20px;font-weight:600;cursor:pointer}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-width:900px}
.sugg button{background:none;border:1px solid var(--night-line);color:var(--night-ink);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.sugg button:hover{border-color:var(--night-mute)}
.hint{color:var(--night-mute);font-size:13px;margin-top:10px;min-height:20px}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:26px}
.stats b{font:700 30px var(--display);display:block;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--night-mute);text-transform:uppercase;letter-spacing:.08em}
.wrap{padding:26px 28px 60px;max-width:1240px;margin:0 auto}
/* pipeline */
.pipe{display:flex;align-items:center;gap:0;margin-bottom:22px;flex-wrap:wrap;row-gap:10px}
.st{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;background:var(--card);transition:all .25s}
.st.on{color:var(--ink)}.st.on .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.st.skip .dot{border-style:dashed}.st.fail .dot{border-color:var(--warn);background:var(--warn);color:#fff}
.bar{flex:0 0 34px;height:2px;background:var(--line);margin:0 8px}.bar.on{background:var(--ok)}
/* answer + evidence */
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.ans{padding:24px 26px}
.q{font:600 15px var(--body);color:var(--mute);margin:0 0 10px}
.atext{font:500 24px/1.5 var(--display);margin:0;text-wrap:pretty}
.num{display:inline-block;background:var(--ok-bg);border-bottom:3px solid var(--ok);padding:0 5px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s}
.num.q{background:var(--violet-bg);border-color:var(--violet)}
.num.sel,.num:hover{background:var(--ok);color:#fff}.num.q.sel,.num.q:hover{background:var(--violet)}
.ring{display:flex;align-items:center;gap:16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.ring svg{flex:none}
.ring b{font:700 18px var(--display)}.ring span{display:block;color:var(--mute);font-size:13px}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.v{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff8;cursor:pointer;text-align:left;width:100%}
.v.sel{border-color:var(--ink);background:#fff}
.chip{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.chip.q{background:var(--violet-bg);color:var(--violet)}.chip.w{background:var(--warn-bg);color:var(--warn)}.chip.n{background:#E5E0D2;color:var(--mute)}
.v .t{font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.v .why{grid-column:1/-1;font-size:13px;color:var(--mute)}
.withheld{padding:26px;border-left:6px solid var(--amber)}
.withheld h3{font:700 24px var(--display);margin:0 0 6px}
/* evidence */
.ev{position:sticky;top:12px;background:var(--night);color:var(--night-ink);border-radius:12px;padding:6px 0;overflow:hidden}
.ev .sec{padding:14px 18px}.ev .sec+.sec{border-top:1px solid var(--night-line)}
.ev h4{margin:0 0 9px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--night-mute)}
.ev pre{margin:0;font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.kw{color:#8FB8FF}.fn{color:#E9B44C}.st-{color:#9BD7A6}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font:12.5px var(--mono);font-variant-numeric:tabular-nums;width:100%}
.tbl th{color:var(--night-mute);text-align:left;font-weight:500;padding:4px 14px 6px 0}
.tbl td{padding:5px 14px 5px 0;border-top:1px solid #2b2a24}
.tbl td.hit{background:#E9B44C;color:var(--night);border-radius:3px;padding-left:6px;font-weight:500}
mark{background:#E9B44C;color:var(--night);padding:1px 3px;border-radius:3px}
.pid{font:11px var(--mono);color:var(--night-mute);display:block;margin-bottom:3px}
.pas{margin:0 0 14px;font:13px/1.6 var(--body);white-space:pre-wrap;color:#d8d3c4}
.empty{color:var(--night-mute);font-size:13px;padding:14px 18px}
/* ledger */
h2{font:700 22px var(--display);margin:40px 0 4px}.lede{color:var(--mute);margin:0 0 14px;font-size:14px}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink)}
.ledger td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger tr.row{cursor:pointer}.ledger tr.row:hover td{background:#ECE6D8}
.mini{display:flex;gap:2px}.mini i{width:9px;height:14px;border-radius:2px;background:var(--ok)}
.mini i.q{background:var(--violet)}
.tw{overflow-x:auto}
.note{font-size:12.5px;color:var(--mute);max-width:110ch;margin-top:22px}
/* trust + report */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tile{padding:20px}.tile b{display:block;font:700 34px var(--display);margin-bottom:4px}.tile p{margin:0;color:var(--mute);font-size:14px}
.cmd{font:13px var(--mono);background:var(--night);color:var(--night-ink);padding:14px 16px;border-radius:8px;white-space:pre;overflow-x:auto}
.btn{border:1px solid var(--ink);background:var(--card);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;margin-top:10px}
.rsec{padding:18px 22px;margin-bottom:12px}.rsec h3{margin:0 0 6px;font:600 17px var(--display)}
@media (max-width:900px){.grid{grid-template-columns:1fr}.hero{padding:0 16px 26px}.wrap{padding:20px 16px 50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="hero">
  <div class="top">
    <div class="logo"><span class="mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span>Verified Analyst</div>
    <div class="tabs" role="tablist"><button role="tab" id="t-ask" aria-selected="true">Ask</button><button role="tab" id="t-rep" aria-selected="false">Report</button><button role="tab" id="t-ev" aria-selected="false">Trust</button></div>
    <span class="mode" title="Model replies are recorded; verification is recomputed">Replay mode</span>
  </div>
  <h1 class="h1">Every number, <em>checked</em> before you see it.</h1>
  <p class="sub">Ask about sales data or company documents. Each figure in the answer is matched to a warehouse cell or a stored passage. If it cannot be backed, the answer is withheld.</p>
  <form class="ask" id="form" autocomplete="off"><input id="q" aria-label="Question" placeholder="Ask a question about the data or the documents" list="qs"><datalist id="qs"></datalist><button class="go" type="submit">Ask</button></form>
  <div class="sugg" id="sugg"></div>
  <div class="hint" id="hint" aria-live="polite"></div>
  <div class="stats" id="stats"></div>
</section>
<div class="wrap" id="app"></div>
<script>
const EMBED = /*DATA*/null;
const S = {items:[], sel:null, tab:'ask', pick:null};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const REASON = {
  ambiguous:'The question is too vague to answer from data. A real analyst would ask what you mean, and so does this system.',
  forecast:'This asks for a prediction. The warehouse holds history only, so no figure about the future can be verified.',
  unsupported_metric:'The planner could not express this with the metrics the semantic layer defines, so it stopped instead of inventing one.',
  unverified:'The drafted answer contained figures that did not match the data.', plan_failed:'No valid query could be planned.',
  no_passage:'No retrievable passage held a figure.', budget:'The token budget for this question ran out.',
  sensitivity:'The data is not cleared for a hosted model.',
  no_recording:'This demo replays recorded model replies, and none was recorded for this question. The system did not abstain; there is simply no stored reply.'
};
const vs = x => (x.verification && x.verification.verification && x.verification.verification.verdicts) || [];
const num = s => parseFloat(String(s).replace(/[^\d.\-]/g,''));
function label(x){ return x.outcome==='verified'?['verified','']:x.outcome==='not_recorded'?['no recording','n']:['withheld','w']; }
function stages(x){
  const routed = !!x.route, data = x.route==='data'||x.route==='both', docs = x.route==='documents'||x.route==='both';
  const ok = x.outcome==='verified';
  const st = [['Route', routed||x.outcome!=='not_recorded', false, !routed&&x.outcome==='abstain'],
    ['Plan SQL', data, !data&&routed, false],['Retrieve', docs, !docs&&routed, false],
    ['Compose', ok||x.outcome==='partially_verified', !routed, false],['Verify', ok, !routed, x.outcome==='abstain'&&routed]];
  return st;
}
function pipe(x){
  return '<div class="pipe" aria-label="Pipeline">' + stages(x).map((s,i)=>
    (i?`<span class="bar ${s[1]?'on':''}"></span>`:'') + `<span class="st ${s[1]?'on':''} ${s[2]?'skip':''} ${s[3]?'fail':''}"><span class="dot">${s[1]?'✓':s[3]?'!':''}</span>${s[0]}</span>`).join('') + '</div>';
}
function ringSvg(n,t){
  const r=26,c=2*Math.PI*r,f=t?n/t:0;
  return `<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="${n} of ${t} figures verified"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#E4DECF" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="#1F7A4D" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="16" fill="#171612">${n}/${t}</text></svg>`;
}
function sqlHi(sql){
  let h = esc(sql);
  h = h.replace(/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|LIMIT|FILTER|AS|DESC|ASC|AND|OR|IN|DISTINCT|NULLIF)\b/g,'<span class="kw">$1</span>')
       .replace(/\b(SUM|COUNT|COALESCE|AVG)\(/g,'<span class="fn">$1</span>(').replace(/&#39;|'([^']*)'/g,m=>m);
  return h.replace(/'([^']*)'/g,'<span class="st-">\'$1\'</span>');
}
function hl(text, needles){
  let h = esc(text);
  needles.filter(Boolean).forEach(n=>{ const e=esc(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); h=h.replace(new RegExp('(?<![\\d.,])'+e+'(?![\\d])','g'), m=>`<mark>${m}</mark>`); });
  return h;
}
function evidence(x, sel){
  const ev = x.evidence||{}, v = vs(x).slice().sort((a,b)=>a.span[0]-b.span[0])[sel];
  let h = '<div class="ev">';
  if(!ev.sql && !ev.passages) return h+'<div class="empty">No evidence: nothing was queried or retrieved for this question.</div></div>';
  if(ev.sql){
    h += `<div class="sec"><h4>SQL · read-only role · guarded</h4><pre>${sqlHi(ev.sql)}</pre></div>`;
    if(ev.rows&&ev.rows.length){
      const target = v && v.verdict!=='VERIFIED_QUOTE' ? (v.expected? num(v.expected):num(v.text)) : null;
      h += `<div class="sec"><h4>Result</h4><div class="tbl"><table><tr>${ev.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>` +
        ev.rows.map(r=>`<tr>${r.map(c=>{ const hit = target!==null && /^-?\d+(\.\d+)?$/.test(c) && Math.abs(num(c)-target) <= Math.max(0.006, Math.abs(target)*1e-6); return `<td class="${hit?'hit':''}">${esc(c)}</td>`;}).join('')}</tr>`).join('') + '</table></div></div>';
    }
  }
  if(ev.passages){
    const needles = v && v.verdict==='VERIFIED_QUOTE' ? [v.text] : vs(x).filter(a=>a.verdict==='VERIFIED_QUOTE').map(a=>a.text);
    h += '<div class="sec"><h4>Passages shown to the model</h4>' + Object.entries(ev.passages).map(([l,p])=>`<span class="pid">${l} · ${esc(p.id)}</span><p class="pas">${hl(p.text,needles)}</p>`).join('') + '</div>';
  }
  return h+'</div>';
}
function answer(x){
  const sorted = vs(x).slice().sort((a,b)=>a.span[0]-b.span[0]);
  const [lab,cls] = label(x);
  if(x.outcome!=='verified' && x.outcome!=='partially_verified'){
    return `<div class="card withheld"><p class="q">${esc(x.question)}</p><h3>${x.outcome==='not_recorded'?'No recorded reply':'Answer withheld'}</h3><p style="margin:0;max-width:60ch">${esc(REASON[x.reason]||x.reason||'')}</p>${x.abstain_detail&&x.abstain_detail.source?`<p class="note">Stopped at: ${esc(x.abstain_detail.source)}</p>`:''}</div>`;
  }
  let t=x.rendered,out='',pos=0;
  sorted.forEach((v,i)=>{ out+=esc(t.slice(pos,v.span[0]))+`<span class="num ${v.verdict==='VERIFIED_QUOTE'?'q':''} ${i===S.sel?'sel':''}" data-i="${i}" tabindex="0" role="button">${esc(t.slice(v.span[0],v.span[1]))}</span>`; pos=v.span[1]; });
  out+=esc(t.slice(pos));
  const how = {cell_bound:'matches a cell of the executed result',in_passage:'found in a stored passage'};
  return `<div class="card ans"><p class="q">${esc(x.question)}</p><p class="atext">${out}</p>
  <div class="ring">${ringSvg(sorted.length,sorted.length)}<div><b>${sorted.length} of ${sorted.length} figures verified</b><span>Click a figure to see where it comes from.</span></div></div>
  <div class="vlist">${sorted.map((v,i)=>`<button class="v ${i===S.sel?'sel':''}" data-i="${i}"><span class="chip ${v.verdict==='VERIFIED_QUOTE'?'q':''}">${v.verdict.replace('VERIFIED_','').replace('VERIFIED','number')}</span><span class="t">${esc(v.text)}</span><span class="why">${how[v.reason]||esc(v.reason)}${v.expected?` · warehouse value ${esc(v.expected)}`:''}${v.detail&&v.verdict==='VERIFIED_QUOTE'?' · '+esc(v.detail):''}</span></button>`).join('')}</div>
  ${x.restatement?`<p class="note" style="margin-top:16px"><b>Query in words:</b> ${esc(x.restatement)}</p>`:''}</div>`;
}
function ledger(){
  return `<h2>All ${S.items.length} recorded questions</h2><p class="lede">Open any row. Withheld and unrecorded questions are shown, not hidden.</p><div class="tw"><table class="ledger"><tr><th>Question</th><th>Route</th><th>Outcome</th><th>Figures</th></tr>` +
  S.items.map((x,i)=>{const [l,c]=label(x);const v=vs(x);return `<tr class="row" data-p="${i}" tabindex="0"><td>${esc(x.question)}</td><td>${esc(x.route||'-')}</td><td><span class="chip ${c}">${l}</span></td><td><span class="mini">${v.map(a=>`<i class="${a.verdict==='VERIFIED_QUOTE'?'q':''}"></i>`).join('')}</span></td></tr>`}).join('') + '</table></div>';
}
function askView(){
  const x = S.items[S.pick];
  let h = '';
  if(x){ h += pipe(x) + `<div class="grid">${answer(x)}<div>${evidence(x,S.sel)}</div></div>`; }
  h += ledger();
  $('app').innerHTML = h;
  $('app').querySelectorAll('[data-i]').forEach(n=>{ n.onclick=()=>{S.sel=+n.dataset.i;askView();}; n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();S.sel=+n.dataset.i;askView();}}; });
  $('app').querySelectorAll('[data-p]').forEach(n=>{ const go=()=>{choose(+n.dataset.p);window.scrollTo({top:0,behavior:'smooth'});}; n.onclick=go; n.onkeydown=e=>{if(e.key==='Enter')go();}; });
}
function choose(i){ S.pick=i; S.sel=0; $('q').value=S.items[i].question; $('hint').textContent=''; setTab('ask'); }
function reportView(){
  const ok=S.items.filter(x=>x.outcome==='verified'), left=S.items.filter(x=>x.outcome!=='verified');
  const cmd='va report draft --title "Weekly check"\nva report approve --who "<your name>" --digest <digest printed by draft>';
  $('app').innerHTML = `<h2 style="margin-top:0">Report draft: Weekly check</h2><p class="lede"><span class="chip w">pending approval</span> &nbsp;${ok.length} verified answers in, ${left.length} left out and listed below.</p>` +
   ok.map(x=>`<div class="card rsec"><h3>${esc(x.question)}</h3><p style="margin:0 0 6px">${esc(x.rendered)}</p><span class="note">${vs(x).length} figure(s) verified</span></div>`).join('') +
   `<h2>Withheld, not in the report</h2><ul>${left.map(x=>`<li>${esc(x.question)} <span class="note">(${esc(x.reason||'not verified')})</span></li>`).join('')}</ul>
   <h2>Approve</h2><p class="lede" style="max-width:70ch">Approval is a named step. It quotes the digest of the draft you read, so an edited draft cannot be approved by mistake. Only then is a Markdown file written. Nothing is emailed or posted.</p><div class="cmd">${esc(cmd)}</div><button class="btn" id="copy">Copy commands</button> <span class="note" id="copied"></span>`;
  $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(cmd);$('copied').textContent='Copied.';}catch(e){$('copied').textContent='Copy failed; select the text above.';}};
}
function trustView(){
  const ok=S.items.filter(x=>x.outcome==='verified'), n=ok.reduce((a,x)=>a+vs(x).length,0), k={};
  ok.forEach(x=>vs(x).forEach(v=>k[v.verdict]=(k[v.verdict]||0)+1));
  $('app').innerHTML = `<h2 style="margin-top:0">What is checked, and what is not</h2><p class="lede">These checks run on every push to GitHub.</p><div class="cols">
   <div class="card tile"><b>30 → 0</b><p>Adversarial answers (wrong row, wrong period, wrong dimension value, wrong metric with the same unit) accepted as verified. Before the sentence-context check, all 30 were accepted.</p></div>
   <div class="card tile"><b>${n}</b><p>Figures in the ${ok.length} verified recorded answers, each traced to a cell of its stored result or to its stored passage (${Object.entries(k).map(([a,b])=>b+' '+a).join(', ')}). A figure with no trace fails the build.</p></div>
   <div class="card tile"><b>Placeholders</b><p>The model writes {c1}-style placeholders. A number it types itself is rejected; displayed digits come from the warehouse or a stored passage.</p></div></div>
   <h2>Not claimed</h2><ul><li>No accuracy figure. These are ${S.items.length} development questions, and ${S.items.filter(x=>x.outcome==='not_recorded').length} have no recorded model reply.</li><li>Verification proves a figure matches its source. It does not prove the source answers the question asked.</li><li>Injection obedience was measured on 5 questions with one model. That is not a safety claim.</li></ul>`;
}
function setTab(t){ S.tab=t; ['ask','rep','ev'].forEach(k=>$('t-'+k).setAttribute('aria-selected',k===t)); ({ask:askView,rep:reportView,ev:trustView})[t](); }
function match(text){
  const t=text.trim().toLowerCase(); if(!t) return -1;
  let i=S.items.findIndex(x=>x.question.toLowerCase()===t); if(i>=0) return i;
  const w=new Set(t.split(/\W+/).filter(a=>a.length>3)); let best=-1,sc=0;
  S.items.forEach((x,j)=>{const s=x.question.toLowerCase().split(/\W+/).filter(a=>a.length>3).filter(a=>w.has(a)).length; if(s>sc){sc=s;best=j;}});
  return sc>=3?best:-1;
}
function init(data){
  S.items=data.items;
  const ok=S.items.filter(x=>x.outcome==='verified').length, nums=S.items.reduce((a,x)=>a+(x.outcome==='verified'?vs(x).length:0),0);
  $('stats').innerHTML=`<div><b>${ok}</b><span>answers verified</span></div><div><b>${nums}</b><span>figures traced</span></div><div><b>${S.items.filter(x=>x.outcome==='abstain').length}</b><span>withheld</span></div><div><b>541,909</b><span>warehouse rows</span></div>`;
  $('qs').innerHTML=S.items.map(x=>`<option value="${esc(x.question)}">`).join('');
  $('sugg').innerHTML=S.items.filter(x=>x.outcome!=='not_recorded').slice(0,9).map(x=>`<button type="button" data-q="${S.items.indexOf(x)}">${esc(x.question.length>52?x.question.slice(0,50)+'…':x.question)}</button>`).join('');
  $('sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.q));
  $('form').onsubmit=e=>{e.preventDefault(); const i=match($('q').value); if(i>=0) choose(i); else $('hint').textContent='That question is not in the recorded set. Live questions need a model key (va ask --provider ... --model ...). Pick one of the suggestions.';};
  $('t-ask').onclick=()=>setTab('ask'); $('t-rep').onclick=()=>setTab('rep'); $('t-ev').onclick=()=>setTab('ev');
  $('foot')&&0; choose(0); 
  const f=document.createElement('p'); f.className='note'; f.style.cssText='max-width:1240px;margin:0 auto;padding:0 28px 40px'; f.textContent=data.note; document.body.appendChild(f);
}
if(EMBED) init(EMBED); else fetch('/api/results').then(r=>r.json()).then(init).catch(()=>{$('app').textContent='Could not load results.';});
</script>
