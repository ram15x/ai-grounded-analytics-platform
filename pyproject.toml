[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-grounded-analytics-platform"
version = "1.0.0"
description = "AI Grounded Analytics Platform: answers business questions from your data and documents, and ties every number to its source or withholds the answer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "sqlglot>=25",
    "pydantic>=2.7",
    "pyyaml>=6",
    "pypdf>=5",
]

[project.optional-dependencies]
# Local CPU embedding models (docs/PHASE_2B_ASSUMPTIONS.md). Package name and version floor are
# UNVERIFIED: written from memory without network access.
local = ["fastembed>=0.3"]
dev = ["pytest>=8", "ruff==0.17.6", "pre-commit>=3"]

[project.scripts]
grounded = "grounded_analytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_analytics"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# long string literals in adversarial data tables read better unwrapped
"tests/test_template.py" = ["E501"]
# invented document text, written as long literals
"corpus/build_synthetic.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs a Postgres server (set GA_TEST_DATABASE_URL); skipped otherwise"]
