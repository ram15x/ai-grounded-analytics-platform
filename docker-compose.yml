# Local Postgres for development. The password is read from your shell environment,
# never from a file:  export POSTGRES_PASSWORD=...   (docker compose refuses to start without it)
services:
  postgres:
    # Postgres 16 with the pgvector extension (same major version as before, so the existing data
    # volume is read as it was; see docs/DOCKER_PGVECTOR_SWITCH.md before recreating the container).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: va_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell first}
      POSTGRES_DB: verified_analyst
    ports:
      - "127.0.0.1:${VA_PG_PORT:-5432}:5432"
    volumes:
      - va_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U va_admin -d verified_analyst"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The web view (recorded runs; no key, no database needed):  docker compose --profile app up app
  # Not built or run where it was written (no Docker daemon): treat as UNVERIFIED.
  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  va_pgdata:
