# Render Blueprint: the public, recorded-runs view only.
# No database, no model key. It shows runs already recorded in demo/.
# Live questions (--byok) need Postgres and are NOT part of this file; see docs/HOSTING.md.
services:
  - type: web
    name: ai-grounded-analytics-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c 'grounded serve --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /
