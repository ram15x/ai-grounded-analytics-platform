# Local Postgres for development. The password is read from your shell environment,
# never from a file:  export POSTGRES_PASSWORD=...   (docker compose refuses to start without it)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: va_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell first}
      POSTGRES_DB: verified_analyst
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - va_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U va_admin -d verified_analyst"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  va_pgdata:
